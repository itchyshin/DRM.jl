<!--Hand-maintained root redirect for the DRM.jl documentation site.

     DO NOT restore the "automatically generated by ..." marker as the first
     line. Documenter and DocumenterVitepress only rewrite this file when it is
     absent or when it begins with their own marker; a non-marker first line is
     the documented way to pin the redirect target across deploys.

     This was learned the hard way: gh-pages 9664dc60b made the same change but
     kept the marker line, and the next deploy (5bedeea35) reverted it inside
     six hours.

     Target is ./dev/, which is rebuilt from main on every push. ./stable/ is
     rebuilt only by a version tag: it is still the v0.7.0 build (2026-08-28),
     and its landing page renders the hero front matter as raw text because that
     tag predates the "@raw html" fence added in the landing-page work (PR #660).
     Once a release tag has rebuilt stable/, point this back at ./stable/.-->
<!DOCTYPE html>
<meta charset="utf-8"/>
<meta http-equiv="refresh" content="0; url=./dev/"/>
<title>DRM.jl</title>
<link rel="canonical" href="https://itchyshin.github.io/DRM.jl/dev/"/>
<p>Redirecting to the <a href="./dev/">DRM.jl documentation</a>.</p>
