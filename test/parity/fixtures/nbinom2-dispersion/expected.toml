[fit]
family = "nbinom2"
formula = "y ~ x; sigma ~ x"
loglik = -2.8548560313239329e+02
aic = 5.7897120626478659e+02
df = 4
n = 200

[coef]
"mu_(Intercept)" = 7.7171329984585174e-02
"mu_x" = 2.7589923047058884e-01
"sigma_(Intercept)" = -4.8896693825477761e-02
"sigma_x" = 3.2874481337610401e-01

[vcov]
order = ["mu_(Intercept)", "mu_x", "sigma_(Intercept)", "sigma_x"]
data = [[1.0412062602521456e-02, 1.9591418318825621e-03, 3.6353362028052652e-04, -6.8757021390917128e-04], [1.9591418318825621e-03, 9.847790263108001e-03, -1.0315671131252049e-04, -5.8592561983306394e-04], [3.6353362028052646e-04, -1.031567113125206e-04, 2.1803532815571246e-02, -1.1154422133722329e-02], [-6.8757021390917139e-04, -5.8592561983306394e-04, -1.1154422133722331e-02, 1.5428069364683364e-02]]

[tol]
atol_loglik = 1e-3
atol_aic = 1e-3
