[vcov]
order = ["mu_(Intercept)", "mu_x", "sigma_(Intercept)", "nu_(Intercept)"]
data = [[3.5091283826846360e-03, 1.7641994943744783e-04, -4.0594039258050227e-04, -3.2350352158007013e-03], [1.7641994943744783e-04, 3.0205020884731368e-03, -1.1647509552650365e-06, -9.3058566286288067e-06], [-4.0594039258050232e-04, -1.1647509552650350e-06, 1.0142056965137557e-02, 5.1460041261279815e-02], [-3.2350352158007013e-03, -9.3058566286287999e-06, 5.1460041261279815e-02, 5.7935919841918937e-01]]

[tol]
