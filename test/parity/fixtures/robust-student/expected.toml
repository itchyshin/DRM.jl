[fit]
family = "student"
formula = "y ~ x; sigma ~ 1; nu ~ 1"
loglik = -2.4023665189460752e+02
aic = 4.8847330378921504e+02
df = 4
n = 180

[coef]
"mu_(Intercept)" = 2.0843127399038375e-01
