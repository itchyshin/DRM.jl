[fit]
family = "biv_gaussian"
formula = "mu1 = y1 ~ x + phylo(1 | species); mu2 = y2 ~ x + phylo(1 | species); sigma1 = sigma1 ~ 1 + phylo(1 | species); sigma2 = sigma2 ~ 1 + phylo(1 | species); rho12 = rho12 ~ 1"
method = "REML"
engine = "tmb"
estimator = "REML"
loglik = -2.196139863046289e+02
n = 128

[coef]
"mu1_(Intercept)" = 7.2825687163642316e-01
"mu1_x" = 3.4026699506291685e-01
"mu2_(Intercept)" = 2.3948869641947232e-01
"mu2_x" = 4.7229338836749485e-01
"rho12_(Intercept)" = 6.5606409403543092e-02
"sigma1_(Intercept)" = -1.2949619116113107e+00
"sigma2_(Intercept)" = -4.4119611042708934e-01

[status]
converged = true
pdHess = true
interval_status = "wald_unavailable"
julia_converged = true
reml_restriction_note = "CORRECTED 2026-08-24. The measured numbers below stand; the EXPLANATION previously attached to them was wrong and is retained here so the error is traceable. It read: 'drmTMB native TMB REML restricts mean fixed effects; DRM.jl reml_q4 profiles mean and scale'. That is false at this fixture's own anchor commit: drmTMB adds beta_sigma1/beta_sigma2 to tmb_random_names whenever a sigma variance component exists (R/drmTMB.R:1122-1152, and the q4 phylo layout reaches it via the phylo_mu_endpoint_dpars fallback), so BOTH engines restrict all four fixed-effect axes. The engines therefore maximise the same restricted likelihood and differ only by the integration constant (n_beta/2)*log(2*pi); with n_beta = 6 that predicts 5.513631. UPDATE 2026-08-25 (post-#484, fixture re-derived): drm(..., method = :REML)'s public route now converges on this cell. fit_q4_reml (src/reml_q4.jl) auto-detects the exact zero-accepted-steps stall this cell used to hit at the ML warm start (one failed line-search step, not slow convergence -- confirmed 2026-08-24, see docs/dev-log/evidence/2026-08-24-biv-q4-phylo-reml-converged.md) and retries via an automatic warm-restart schedule, judged at the caller's own unchanged g_tol. Reproduced independently at this re-derivation: through drm()'s public defaults alone (q4_g_tol=1e-3, q4_iterations=300, q4_n_newton=40, no non-default kwargs) -- converged = true, g_residual = 5.295e-4 < g_tol = 1e-3. status.julia_converged above is now true; both false (2026-08-16/24) and true (2026-08-25) were accurate statements about the runtime that produced them -- the field tracks the public route, which changed when #484 landed, not this note. On this converged point: DRM_reml = -225.129555 vs TMB_reml = -219.613986 -> TMB_reml - DRM_reml = 5.515569, against the predicted (n_beta/2)*log(2*pi) = 5.513631 (n_beta = 6) -- residual = 0.001938, tighter than the 0.008650 a prior MANUAL two-stage restart got on 2026-08-24 (that restart is now superseded by the automatic one), and ~60x smaller than the 0.116 non-converged residual. max |d_coef| = 0.002889 (sigma2_(Intercept)), inside the re-derived atol_coef below by roughly 15x. VERDICT UNCHANGED: the constant-offset prediction HOLDS -- this is NOT a different-restricted-likelihood row, now confirmed on the fixture's own recorded (public-route, converged) numbers rather than a side manual restart. [tol] RE-DERIVED AGAIN 2026-08-25 after #477 landed. It previously read atol_loglik = (n_beta/2)*log(2*pi) [5.513631, the integration-constant offset between DRM.jl's unnormalised and drmTMB's normalised restricted log-likelihood] + 0.03 [this cell's cross-optimum reml_ll spread from independently g-converged restarts] = 5.5436. DRM.jl's bivariate routes now REPORT the normalised form, matching drmTMB, TMB, lme4, glmmTMB and DRM.jl's own univariate REML routes, so the integration-constant term is gone and only the cross-optimum spread remains: atol_loglik = 0.03. That is a 185x tightening of this gate, and it is the evidence that #477 was a reporting-convention bug and not a different-restricted-likelihood row -- a tolerance that existed almost entirely to absorb a constant was testing almost nothing. Verified: 33/33 at 0.03. atol_coef/rtol_coef = 10% of drmTMB's own Wald SEs on this fixture's data (median SE across the 7 coefficients for atol_coef = 0.1 x 0.251352 = 0.0251; same 10% fraction for rtol_coef), refit via drmTMB on the committed data.csv/tree.newick (no regeneration) before comparing to DRM.jl's answer. 10% (not #483's 1%, used for an exact-O(p)-gradient parameter) because this REML profile is optimised via finite-difference gradients (h_inner = 5e-4 in reml_q4.jl), a materially coarser numerical regime. Full derivation: docs/dev-log/evidence/2026-08-25-biv-q4-phylo-reml-fixture-rederived.md. CORRECTION 2026-09-01 (#575, exact-gradient slice), appended rather than rewritten so the justification history stays traceable: the sentence above justifying rtol_coef = 10% by 'this REML profile is optimised via finite-difference gradients (h_inner = 5e-4 in reml_q4.jl), a materially coarser numerical regime' NO LONGER DESCRIBES THE ENGINE. fit_q4_reml now evaluates and differentiates the restricted objective EXACTLY at a joint-Newton-certified (u, beta) mode (reml_nll_and_exact_grad in src/reml_q4.jl; derivation in docs/src/developer-notes/reml-q4-exact-gradient.md), verified against a step-scanned central difference to max abs err 6.1e-8 at three phi points on this fixture. The coarse-regime premise for the 10% fraction is therefore withdrawn. The measured numbers and the tolerances below are LEFT UNCHANGED in this slice -- re-deriving them needs a fresh drmTMB Wald-SE refit, which this slice did not run -- so 10% now stands unjustified rather than justified, and re-deriving atol_coef/rtol_coef against the exact-gradient regime is outstanding. On the exact-gradient engine the public cold-start route reaches DRM_reml (normalised) = -219.614005, converged, g_residual = 9.47e-5, against TMB_reml = -219.613986 -- a gap of 1.9e-5, ~100x smaller than the 0.001938 recorded above."

[tol]
atol_loglik = 0.03
atol_coef = 0.0251
rtol_coef = 0.10
