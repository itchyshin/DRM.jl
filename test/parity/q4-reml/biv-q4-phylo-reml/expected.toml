[fit]
family = "biv_gaussian"
formula = "mu1 = y1 ~ x + phylo(1 | species); mu2 = y2 ~ x + phylo(1 | species); sigma1 = sigma1 ~ 1 + phylo(1 | species); sigma2 = sigma2 ~ 1 + phylo(1 | species); rho12 = rho12 ~ 1"
method = "REML"
engine = "tmb"
estimator = "REML"
loglik = -2.196139863046289e+02
n = 128

[coef]
"mu1_(Intercept)" = 7.2825687163642316e-01
"mu1_x" = 3.4026699506291685e-01
"mu2_(Intercept)" = 2.3948869641947232e-01
"mu2_x" = 4.7229338836749485e-01
"rho12_(Intercept)" = 6.5606409403543092e-02
"sigma1_(Intercept)" = -1.2949619116113107e+00
"sigma2_(Intercept)" = -4.4119611042708934e-01

[status]
converged = true
pdHess = true
interval_status = "wald_unavailable"
julia_converged = false
reml_restriction_note = "CORRECTED 2026-08-24. The measured numbers below stand; the EXPLANATION previously attached to them was wrong and is retained here so the error is traceable. It read: 'drmTMB native TMB REML restricts mean fixed effects; DRM.jl reml_q4 profiles mean and scale'. That is false at this fixture's own anchor commit: drmTMB adds beta_sigma1/beta_sigma2 to tmb_random_names whenever a sigma variance component exists (R/drmTMB.R:1122-1152, and the q4 phylo layout reaches it via the phylo_mu_endpoint_dpars fallback), so BOTH engines restrict all four fixed-effect axes. The engines therefore maximise the same restricted likelihood and differ only by the integration constant (n_beta/2)*log(2*pi); with n_beta = 6 that predicts 5.5136 against the measured d_loglik = -5.63, leaving 0.116 consistent with julia_converged = false on this Mac-small p=16 cell. Measured 2026-08-16: d_loglik ~ -5.63; max |d_coef| ~ 0.032. The declared [tol] was sized from the refuted structural story and should be re-derived once a CONVERGED Julia fit exists. Not coverage, not AI-REML."

[tol]
atol_loglik = 6.0
atol_coef = 0.05
rtol_coef = 0.05
