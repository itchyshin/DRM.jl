reml_restriction_note = "drmTMB native TMB REML restricts mean fixed effects; DRM.jl reml_q4 profiles mean and scale. logLik is not a 1e-3 twin. Measured 2026-08-16: d_loglik ≈ -5.63; max |d_coef| ≈ 0.032. Not coverage, not AI-REML."

[tol]
atol_loglik = 6.0
atol_coef = 0.05
rtol_coef = 0.05
