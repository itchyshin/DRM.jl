[fit]
family = "biv_gaussian"
formula = "mu1 = y1 ~ x + phylo(1 | species); mu2 = y2 ~ x + phylo(1 | species); sigma1 = sigma1 ~ 1 + phylo(1 | species); sigma2 = sigma2 ~ 1 + phylo(1 | species); rho12 = rho12 ~ 1"
method = "REML"
engine = "tmb"
estimator = "REML"
loglik = -2.196139863046289e+02
n = 128

[coef]
