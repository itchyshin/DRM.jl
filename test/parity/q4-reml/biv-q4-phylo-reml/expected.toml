[fit]
family = "biv_gaussian"
formula = "mu1 = y1 ~ x + phylo(1 | species); mu2 = y2 ~ x + phylo(1 | species); sigma1 = sigma1 ~ 1 + phylo(1 | species); sigma2 = sigma2 ~ 1 + phylo(1 | species); rho12 = rho12 ~ 1"
method = "REML"
engine = "tmb"
estimator = "REML"
loglik = -2.196139863046289e+02
n = 128

[coef]
"mu1_(Intercept)" = 7.2825687163642316e-01
"mu1_x" = 3.4026699506291685e-01
"mu2_(Intercept)" = 2.3948869641947232e-01
"mu2_x" = 4.7229338836749485e-01
"rho12_(Intercept)" = 6.5606409403543092e-02
"sigma1_(Intercept)" = -1.2949619116113107e+00
"sigma2_(Intercept)" = -4.4119611042708934e-01

[status]
converged = true
pdHess = true
interval_status = "wald_unavailable"
julia_converged = false
reml_restriction_note = "CORRECTED 2026-08-24. The measured numbers below stand; the EXPLANATION previously attached to them was wrong and is retained here so the error is traceable. It read: 'drmTMB native TMB REML restricts mean fixed effects; DRM.jl reml_q4 profiles mean and scale'. That is false at this fixture's own anchor commit: drmTMB adds beta_sigma1/beta_sigma2 to tmb_random_names whenever a sigma variance component exists (R/drmTMB.R:1122-1152, and the q4 phylo layout reaches it via the phylo_mu_endpoint_dpars fallback), so BOTH engines restrict all four fixed-effect axes. The engines therefore maximise the same restricted likelihood and differ only by the integration constant (n_beta/2)*log(2*pi); with n_beta = 6 that predicts 5.5136 against the measured d_loglik = -5.63, leaving 0.116 consistent with julia_converged = false on this Mac-small p=16 cell. Measured 2026-08-16: d_loglik ~ -5.63; max |d_coef| ~ 0.032. The declared [tol] was sized from the refuted structural story and should be re-derived once a CONVERGED Julia fit exists. Not coverage, not AI-REML. FOLLOW-UP 2026-08-24 (same data, same day): reproduced julia_converged = false with drm()'s single-call defaults (q4_g_tol=1e-3, q4_iterations=300, q4_n_newton=40) -- verbose Optim trace shows the REML LBFGS takes ZERO accepted steps past the ML warm start ('Iter 0' only, gradient norm 0.00792), and this is IDENTICAL across q4_n_newton in {40,80,120}, q4_iterations in {300,800}, and q4_g_tol in {1e-3,1e-4}: none of the three knobs drm() exposes move the outcome, because the failure is one failed line-search step at the warm start, not slow convergence. A genuinely CONVERGED point was reached with better starting values: a two-stage warm-restart (coarse LBFGS pass at g_tol=1e-2 to move past the barrier, then continued from there at the same default g_tol=1e-3) via direct DRM.fit_q4_reml calls -- Optim g_converged = true, g_residual = 6.30e-4 (< the 1e-3 default). This restart is not wired through drm()'s public single-call kwargs, so julia_converged above still correctly reports the single-call route's honest false; see docs/dev-log/evidence/2026-08-24-biv-q4-phylo-reml-converged.md for the reproducible method. On that converged point: DRM_reml = -225.118968 vs TMB_reml = -219.613986 -> TMB_reml - DRM_reml = 5.504981, against the predicted (n_beta/2)*log(2*pi) = 5.513631 (n_beta = 6) -- residual = 0.008650, about 13x smaller than the non-converged residual of 0.116, and of the size expected from FD-gradient-optimizer precision on this small (p=16) cell (nearby g-converged points from further restarts varied reml_ll by roughly +/-0.03, all giving a residual an order of magnitude below the non-converged case). max |d_coef| = 0.042490 (sigma1_(Intercept)), inside the declared atol_coef = 0.05. VERDICT: the constant-offset prediction HOLDS on a converged fit -- this is NOT a different-restricted-likelihood row. [tol] below is deliberately left UNCHANGED: it still has to cover the CURRENT single-call drm() route, which remains non-converged (d_loglik ~ -5.63); re-deriving it to converged-fit scale (atol_loglik ~ 0.05-0.1) only makes sense once a warm-restart schedule is wired into the public API, which is a src/ change and out of scope here."

[tol]
atol_loglik = 6.0
atol_coef = 0.05
rtol_coef = 0.05
