name: Documenter
# Single cheap Linux job. Deploys dev docs on push to main (keeps the site
# current) and release docs on version tags. On a PR it BUILDS ONLY -- no
# gh-pages write, so the required check cannot be evicted from the deploy
# queue (see the concurrency block below). The
# DocumenterVitepress (npm) build uses Node from NodeJS_20_jll — no setup-node.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  # Cancel superseded runs on PR refs only. On `main` every push must run to
  # completion: on 2026-09-02 five merges inside two minutes cancelled each
  # other's docs run, and a :missing_docs failure that entered at the first of
  # them stayed invisible until the last push happened to finish (#589/#590).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    # Only a run that DEPLOYS joins the repo-wide serialisation group.
    #
    # Why the group exists (#654): the workflow-level group above is keyed on
    # `github.ref`, so two different refs run at once -- and both push to the
    # single shared `gh-pages` ref. That raced on 2026-09-05 (#650):
    #   ! [remote rejected] HEAD -> gh-pages
    #     (cannot lock ref 'refs/heads/gh-pages': is at 2aa387ee8 but expected a2fa18165)
    #
    # Why #654 was only half a fix: `cancel-in-progress: false` protects the
    # RUNNING job, but says nothing about a PENDING one. Per GitHub's concurrency
    # reference, "any existing pending job or workflow in the same concurrency
    # group will be canceled and the new queued job or workflow will take its
    # place" -- a default that `cancel-in-progress` does not switch off. A group
    # holds at most one running + one pending job, so under load a third arrival
    # evicts whoever was waiting. `docs` is REQUIRED and a cancelled check never
    # reports success, so PR #748 was evicted 30+ times in a row and could not
    # merge, through no fault of its own.
    #
    # The fix is to keep the REQUIRED gate out of the group entirely. A
    # pull_request run is build-only (DRM_DOCS_DEPLOY=false below), never touches
    # gh-pages, and therefore needs no serialisation -- it gets a group unique to
    # its own run and can never be evicted. Pushes to main, version tags and
    # workflow_dispatch still deploy, and they still serialise exactly as before.
    #
    # `cancel-in-progress: false` stays load-bearing for those deploying runs: a
    # cancelled run reports as cancelled, the same shape as #589/#590 above.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('docs-build-{0}', github.run_id) || 'docs-gh-pages-deploy' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Build (and deploy on push to main / tag / dispatch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          # Build-only on pull_request: see the concurrency comment above.
          DRM_DOCS_DEPLOY: ${{ github.event_name != 'pull_request' }}
        run: julia --project=docs docs/make.jl
