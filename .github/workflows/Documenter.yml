name: Documenter
# Single cheap Linux job. Deploys dev docs on push to main (keeps the site
# current), release docs on version tags, builds as a check on PRs. The
# DocumenterVitepress (npm) build uses Node from NodeJS_20_jll — no setup-node.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  # Cancel superseded runs on PR refs only. On `main` every push must run to
  # completion: on 2026-09-02 five merges inside two minutes cancelled each
  # other's docs run, and a :missing_docs failure that entered at the first of
  # them stayed invisible until the last push happened to finish (#589/#590).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    # Serialise the gh-pages DEPLOY across every ref in the repo. The
    # workflow-level group above is keyed on `github.ref`, so two different PRs
    # land in different groups and run at the same time -- and both push to the
    # single shared `gh-pages` ref. That raced on 2026-09-05 (#650):
    #   ! [remote rejected] HEAD -> gh-pages
    #     (cannot lock ref 'refs/heads/gh-pages': is at 2aa387ee8 but expected a2fa18165)
    # `docs` is a REQUIRED status check, so a PR was blocked by another PR's
    # timing, with nothing wrong in either.
    #
    # `cancel-in-progress: false` is load-bearing and must NOT be flipped: a
    # cancelled `docs` run reports as cancelled, and a cancelled required check
    # blocks its PR -- the same shape as #589/#590 noted above, one level down.
    # Job-level (not workflow-level) so the per-ref superseded-run cancellation
    # for repeated pushes to one PR is preserved.
    concurrency:
      group: docs-gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      - name: Build (and deploy on tag / dispatch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
