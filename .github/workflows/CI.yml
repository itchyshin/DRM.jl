name: CI
# Cost-disciplined: PR + manual only, Linux only. Add macOS/Windows + a `push`
# trigger to `main` only right before a tagged release / CRAN-equivalent.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_p10k:
        description: "Include p=10000 in the multi-shape scaling sweep (#16, minutes-scale)"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is there anything in this PR that the Julia suite could possibly affect?
  # `test (1)` and `test (1.10)` are REQUIRED status checks on `main`, so this
  # must NOT be done with `paths-ignore`: a required check that never reports
  # leaves the PR pending forever. The jobs below therefore always RUN and
  # always report -- they just do no work when only prose changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # manual dispatch: always run
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          # Anything OUTSIDE this prose allow-list means run the suite.
          # docs/src and docs/make.jl are deliberately NOT here: Documenter
          # doctests execute code, so a change there still deserves the suite.
          if git diff --name-only "$base" HEAD \
               | grep -qvE '^(docs/dev-log/|docs/design/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Say which way it went
        run: echo "code=${{ steps.filter.outputs.code }}"

      # If we are about to skip the suite, the diff that skips it must at least be
      # clean. Ported from gllvmTMB's "Fast pass for ignored-source/process change",
      # which has had this gate all along -- and which caught a real defect on
      # 2026-09-04 that this repo's version would have waved through: two restored
      # documents carrying 17 lines of trailing whitespace.
      - name: Fast-path validation (a prose-only diff must still be clean)
        if: steps.filter.outputs.code != 'true'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          # non-zero on trailing whitespace or a conflict marker in ADDED lines
          git diff --check "$base" HEAD
          {
            echo "### Fast-path validation"
            echo
            echo "Julia suite skipped: prose-only change."
            echo
            echo "Validation run:"
            echo "- \`git diff --check\` over the changed-file range"
            echo "  (trailing whitespace, conflict markers)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v6
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/cache@v2
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/julia-buildpkg@v1
      - if: needs.changes.outputs.code == 'true'
        uses: julia-actions/julia-runtest@v1
      - if: needs.changes.outputs.code != 'true'
        run: echo "Prose-only change -- Julia suite skipped, this check still reports."

  # Engine-quality Q-gate #16: multi-shape (balanced + caterpillar) O(p) scaling
  # sweep. NOT per-PR (the p=10k cell is minutes-scale) — manual dispatch only.
  # Default grid is {100, 1000}; set run_p10k=true to add the p=10k cell.
  scaling-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run multi-shape scaling gate (#16)
        env:
          DRM_QGATE_PS: ${{ github.event.inputs.run_p10k == 'true' && '100,1000,10000' || '100,1000' }}
          DRM_QGATE_SHAPES: balanced,caterpillar
          DRM_QGATE_NREP: '4'
        run: julia --project=. bench/run_scaling.jl
      - name: Upload scaling report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qgate-multishape-scaling
          path: report/qgate-multishape-scaling.md
